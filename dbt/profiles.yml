taxi:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PG_HOST', 'localhost') }}"
      port: "{{ env_var('PG_PORT', '5434') | int }}"
      user: "{{ env_var('PG_USER', 'taxi') }}"
      password: "{{ env_var('PG_PASSWORD', 'taxi') }}"
      dbname: "{{ env_var('PG_DB', 'taxi') }}"
      schema: public
      threads: 2
