version: 2

models:
  - name: dim_zone
    description: "Una fila por zona de la TLC"
    columns:
      - name: location_id
        tests: [unique, not_null]

  - name: dim_date
    description: "Una fila por dia"
    columns:
      - name: date_key
        tests: [unique, not_null]

  - name: fact_trips
    description: "Una fila por viaje aceptado"
    columns:
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: pu_location_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: location_id
      - name: do_location_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: location_id
      - name: total_amount
        tests: [not_null]

  - name: agg_zone_hour
    description: "Viajes, ingreso y duracion media por zona de origen, fecha y hora"
    columns:
      - name: viajes
        tests: [not_null]
