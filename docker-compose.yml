services:
  postgres:
    image: postgres:16.4
    container_name: taxi_postgres
    environment:
      POSTGRES_USER: taxi
      POSTGRES_PASSWORD: taxi
      POSTGRES_DB: taxi
    command: postgres -c shared_buffers=512MB -c work_mem=64MB
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxi -d taxi"]
      interval: 5s
      retries: 10

  pipeline:
    build: .
    container_name: taxi_pipeline
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: taxi
      PG_PASSWORD: taxi
      PG_DB: taxi
      MES: ${MES:-2025-03}
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data: